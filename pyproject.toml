[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ch-accounts-mcp"
dynamic = ["version"]
description = "MCP server that reads Companies House audited accounts with arithmetic verification and figure-level citations"
readme = "ch_accounts_mcp/README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.30,<2",
    "pymupdf>=1.24",
    "rapidocr-onnxruntime>=1.4.4",
    "onnxruntime>=1.18",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "starlette>=0.37",
    "openpyxl>=3.1",
    "pillow>=10",
]

[project.optional-dependencies]
# PaddleOCR on CUDA for production GPU hosts (OCR_DEVICE=cuda); pick the paddlepaddle-gpu wheel matching the CUDA version
gpu = ["paddleocr>=2.7"]
dev = ["pytest>=8"]

[project.scripts]
ch-accounts-mcp = "ch_accounts_mcp.server:main"

[tool.setuptools]
packages = ["ch_accounts_mcp"]

[tool.setuptools.dynamic]
version = { attr = "ch_accounts_mcp.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
